name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  generated:
    # The pages in public/ are generated by site/build.py: fail if they were edited by hand or not rebuilt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix site ci
      - run: pip install markdownify==1.2.3
      - run: python3 site/build.py
      - run: git diff --exit-code -- public
